<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="WMmD0muXZ0244fx-DxNWFyhUdSBbLjUBZfSIjzzQmW0" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marjon Musta – Selected Works, Novel & Interactive Portfolio</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Playfair+Display:ital,wght@0,600;1,600&family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        /* Showcase Page Styling */
        body {
          background-color: #fcfbf9; /* Soft literary paper/linen background */
          margin: 0;
          padding: 40px 20px;
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
        }

        .showcase-container {
          max-width: 1000px;
          width: 100%;
        }

        .showcase-header {
          text-align: center;
          margin-bottom: 50px;
        }

        .showcase-header h1 {
          font-family: 'Playfair Display', serif;
          font-size: 1.8rem;
          font-weight: 600;
          color: #1a1c1b;
          margin-bottom: 8px;
          letter-spacing: 1px;
        }

        .showcase-header p {
          font-family: 'Plus Jakarta Sans', sans-serif;
          font-size: 0.75rem;
          text-transform: uppercase;
          letter-spacing: 3px;
          color: #7d827f;
          font-weight: 700;
        }

        .showcase-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
          gap: 30px;
        }

        .showcase-card {
          background: #ffffff;
          border: 1px solid #eae7e1;
          border-radius: 8px;
          padding: 50px 30px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          position: relative;
          min-height: 150px;
          box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
          transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .showcase-card:hover {
          transform: translateY(-4px);
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }

        .card-label {
          position: absolute;
          top: 15px;
          left: 20px;
          font-family: 'Plus Jakarta Sans', sans-serif;
          font-size: 0.6rem;
          text-transform: uppercase;
          letter-spacing: 2px;
          color: #a8ada9;
          font-weight: 700;
        }

        /* STYLE 1: Dual-Texture Editorial */
        .special-name-1 {
          display: inline-block;
          position: relative;
          cursor: default;
        }

        .special-name-1 .first-name {
          font-family: 'Plus Jakarta Sans', sans-serif;
          font-weight: 800;
          text-transform: uppercase;
          letter-spacing: 5px;
          color: #090c0b;
          font-size: 2rem;
        }

        .special-name-1 .last-name {
          font-family: 'Cormorant Garamond', serif;
          font-style: italic;
          font-weight: 300;
          color: #b74c26;
          font-size: 2.4rem;
          margin-left: -5px;
        }

        .special-name-1 .editorial-line {
          width: 40px;
          height: 2px;
          background: #e5a953;
          margin-top: 8px;
          transition: width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .special-name-1:hover .editorial-line {
          width: 100%;
        }

        /* STYLE 2: The Full Literary Moniker */
        .special-name-2 {
          display: flex;
          align-items: center;
          gap: 1.2rem;
          cursor: default;
        }

        .special-name-2 .initial-badge {
          font-family: 'Cormorant Garamond', serif;
          font-size: 2.2rem;
          font-weight: 300;
          color: #ffffff;
          background: linear-gradient(135deg, #b74c26, #6b1f1f);
          width: 55px;
          height: 55px;
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: 50%;
          box-shadow: 0 10px 20px rgba(183, 76, 38, 0.15);
        }

        .special-name-2 .name-text {
          display: flex;
          flex-direction: column;
        }

        .special-name-2 .full-identity {
          font-family: 'Playfair Display', serif;
          font-size: 1.5rem;
          font-weight: 600;
          letter-spacing: 0.5px;
          background: linear-gradient(120deg, #090c0b, #b74c26);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        .special-name-2 .identity-sub {
          font-family: 'Plus Jakarta Sans', sans-serif;
          font-size: 0.6rem;
          text-transform: uppercase;
          letter-spacing: 3px;
          color: #384d39;
          font-weight: 700;
          margin-top: 3px;
        }

        /* STYLE 3: The Shard Silhouette */
        .special-name-3 {
          font-family: 'Cormorant Garamond', serif;
          font-size: 2.2rem;
          font-weight: 300;
          letter-spacing: 3px;
          color: #090c0b;
          cursor: default;
        }

        .special-name-3 .letter-accent {
          font-family: 'Playfair Display', serif;
          color: #b74c26;
          font-style: italic;
          font-weight: 600;
        }

        .special-name-3 .gold-shimmer {
          font-weight: 500;
          transition: color 0.4s ease, text-shadow 0.4s ease;
        }

        .special-name-3:hover .gold-shimmer {
          color: #e5a953;
          text-shadow: 0 0 15px rgba(229, 169, 83, 0.25);
        }
    </style>
</head>
<body>

<div class="showcase-container">
  <header class="showcase-header">
    <h1>Signature Design System</h1>
    <p>Marjon Musta — Portfolio Brand Marks</p>
  </header>

  <div class="showcase-grid">
    <!-- Option 1 -->
    <div class="showcase-card">
      <div class="card-label">01 // Dual-Texture Editorial</div>
      <div class="special-name-1">
        <span class="first-name">Marjon</span>
        <span class="last-name">Musta</span>
        <div class="editorial-line"></div>
      </div>
    </div>

    <!-- Option 2 -->
    <div class="showcase-card">
      <div class="card-label">02 // The Full Moniker</div>
      <div class="special-name-2">
        <div class="initial-badge">M</div>
        <div class="name-text">
          <span class="full-identity">Marjon Maksim Musta</span>
          <span class="identity-sub">Independent Novelist & Designer</span>
        </div>
      </div>
    </div>

    <!-- Option 3 -->
    <div class="showcase-card">
      <div class="card-label">03 // The Shard Silhouette</div>
      <div class="special-name-3">
        <span class="letter-accent">M</span>arjon <span class="gold-shimmer">Musta</span>
      </div>
    </div>
  </div>
</div>

</body>
</html>
